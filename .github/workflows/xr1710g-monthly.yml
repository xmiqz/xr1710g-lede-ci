name: Build XR1710G LEDE + U-Boot bundle

on:
  schedule:
    # 18:00 UTC on the 1st = 02:00 Asia/Shanghai on the 2nd.
    - cron: "0 18 1 * *"
  workflow_dispatch:
    inputs:
      lede_ref:
        description: "LEDE branch, tag, or commit (known-good XR1710G baseline)"
        required: false
        default: "98b3eed3ecb33da1be94d5084284b3644a864622"
      uboot_tag:
        description: "Verified YYH2913/http-uboot release tag"
        required: false
        default: "xr1710g_261102"
      profile:
        description: "Package profile"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - trimmed
      npu_wed:
        description: "Enable MT7996 NPU/WED data path (stage 1, high risk)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: xr1710g-lede-build
  cancel-in-progress: false

jobs:
  build:
    name: LEDE XR1710G
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      UBOOT_REPO: YYH2913/http-uboot
      UBOOT_TAG: ${{ github.event.inputs.uboot_tag || 'xr1710g_261102' }}
      LEDE_REF: ${{ github.event.inputs.lede_ref || '98b3eed3ecb33da1be94d5084284b3644a864622' }}
      PROFILE: ${{ github.event.inputs.profile || 'default' }}
      NPU_WED: ${{ github.event.inputs.npu_wed || 'false' }}

    steps:
      - name: Free disk space
        run: |
          set -euxo pipefail
          # Keep the tool cache and the runner's Node.js. Large language SDKs
          # are not needed by LEDE and are safe to remove on the ephemeral host.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Checkout CI files
        uses: actions/checkout@v4
        with:
          path: ci
          fetch-depth: 1

      - name: Checkout LEDE
        uses: actions/checkout@v4
        with:
          repository: coolsnowwolf/lede
          ref: ${{ env.LEDE_REF }}
          path: lede
          fetch-depth: 1

      - name: Add XR1710G packages and first-boot defaults
        run: |
          mkdir -p lede/package/xr1710g
          cp -a ci/packages/. lede/package/xr1710g/
          mkdir -p lede/files
          cp -a ci/files/. lede/files/
          chmod 0755 lede/files/etc/uci-defaults/99-xr1710g-argon
          chmod 0755 lede/files/etc/uci-defaults/92-xr1710g-npu-baseline

      - name: Apply XR1710G NPU patches
        run: |
          set -euxo pipefail
          # Stage 0: PPE accounting + any airoha patch LEDE's pinned tree lacks.
          dst=lede/target/linux/airoha/patches-6.18
          mkdir -p "$dst"
          # LEDE's pinned airoha tree already carries the v7.1 PPE fixes under
          # the same file names (content is equivalent; only the hunk offsets
          # differ). Treat an existing same-named patch as authoritative and
          # only copy the ones LEDE is missing.
          for p in ci/patches/lede/airoha/*.patch; do
            name=$(basename "$p")
            if [ -e "$dst/$name" ]; then
              echo "already in LEDE, skipping: $name"
            else
              cp -v "$p" "$dst"/
            fi
          done
          # The target config-6.18 ships with NET_AIROHA_FLOW_STATS disabled as
          # an explicit "is not set" line, so rewrite that line instead of
          # appending a duplicate symbol.
          cfg=lede/target/linux/airoha/an7581/config-6.18
          if grep -q '^# CONFIG_NET_AIROHA_FLOW_STATS is not set$' "$cfg"; then
            sed -i 's/^# CONFIG_NET_AIROHA_FLOW_STATS is not set$/CONFIG_NET_AIROHA_FLOW_STATS=y/' "$cfg"
          elif ! grep -q '^CONFIG_NET_AIROHA_FLOW_STATS=y$' "$cfg"; then
            echo 'CONFIG_NET_AIROHA_FLOW_STATS=y' >> "$cfg"
          fi
          if [ "$NPU_WED" = "true" ]; then
            # Stage 1: mt76 NPU stack fixes, boot-time wed_enable, DSA/DRAM path.
            mkdir -p lede/package/kernel/mt76/patches-6.18
            cp -v ci/patches/mt76/patches-6.18/*.patch lede/package/kernel/mt76/patches-6.18/
            # Use a separate 99- file instead of rewriting the kmod-generated
            # /etc/modules.d/mt7996e: kmodloader sorts names, so 99- runs first
            # and loads the module with wed_enable=1 before the plain entry.
            # This is byte-for-byte the layout proven on the ImmortalWrt APs.
            mkdir -p lede/files/etc/modules.d
            cp -v ci/npu-wed/etc/modules.d/99-mt7996e-wed lede/files/etc/modules.d/99-mt7996e-wed
            sed -i '/^&eth {/a\    airoha,dsa-dram-forwarding;' \
              lede/target/linux/airoha/dts/an7581-xr1710g.dts
            grep -q 'airoha,dsa-dram-forwarding' \
              lede/target/linux/airoha/dts/an7581-xr1710g.dts
          fi

      - name: Verify XR1710G NPU build inputs
        run: |
          set -euxo pipefail
          grep -q '^CONFIG_NET_AIROHA_FLOW_STATS=y$' \
            lede/target/linux/airoha/an7581/config-6.18
          test -f lede/target/linux/airoha/patches-6.18/144-*.patch
          test -f lede/target/linux/airoha/patches-6.18/147-*.patch
          echo "stage0 inputs OK"
          if [ "$NPU_WED" = "true" ]; then
            test -f lede/files/etc/modules.d/99-mt7996e-wed
            grep -q '^mt7996e wed_enable=1$' lede/files/etc/modules.d/99-mt7996e-wed
            count=$(ls lede/package/kernel/mt76/patches-6.18/*.patch | wc -l)
            echo "mt76 patches: $count"
            [ "$count" -ge 15 ] || { echo "expected >=15 mt76 patches" >&2; exit 1; }
            test -f lede/package/kernel/mt76/patches-6.18/0100-*.patch
            test -f lede/package/kernel/mt76/patches-6.18/0115-*.patch
            grep -q 'airoha,dsa-dram-forwarding' \
              lede/target/linux/airoha/dts/an7581-xr1710g.dts
            # Stage 2: IRQ placement package and its verification tool.
            test -f lede/package/xr1710g/xr1710g-npu-tuning/Makefile
            test -f lede/package/xr1710g/xr1710g-npu-tuning/files/usr/bin/xr1710g-irq-balance
            test -f lede/package/xr1710g/xr1710g-npu-tuning/files/usr/bin/xr1710g-offload-check
            test -f lede/package/xr1710g/xr1710g-npu-tuning/files/etc/config/xr1710g_npu
            echo "stage1 inputs OK"
          fi

      - name: Download prebuilt Nikki runtime
        run: |
          set -euxo pipefail
          mkdir -p lede/package/xr1710g/yq/files lede/package/xr1710g/mihomo/files
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/mikefarah/yq/releases/download/v4.33.1/yq_linux_arm64 \
            -o lede/package/xr1710g/yq/files/yq
          echo "e3a47e60765322995f11422108829881d2166dcf9b13a3ae8ad2c002ee61f8a1  lede/package/xr1710g/yq/files/yq" \
            | sha256sum -c -
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-arm64-v1.19.33.gz \
            -o /tmp/mihomo-linux-arm64-v1.19.33.gz
          echo "ba408b317080ee265c46cb923a50018c1b82cbd708551cdd46a1e3e307396187  /tmp/mihomo-linux-arm64-v1.19.33.gz" \
            | sha256sum -c -
          gzip -dc /tmp/mihomo-linux-arm64-v1.19.33.gz > lede/package/xr1710g/mihomo/files/mihomo
          chmod 0755 lede/package/xr1710g/yq/files/yq lede/package/xr1710g/mihomo/files/mihomo

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz \
            msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev jq zip

      - name: Prepare LEDE configuration
        working-directory: lede
        run: |
          if [ "$PROFILE" = "trimmed" ]; then
            cp ../ci/configs/xr1710g-trimmed.config .config
          else
            cp ../ci/configs/xr1710g.config .config
          fi
          sed -i 's/#src-git helloworld/src-git helloworld/g' feeds.conf.default
          ./scripts/feeds update -a
          # The LEDE luci feed carries an older, smaller luci-app-airoha-npu.
          # Keep the XR1710G-specific package from ci/packages instead.
          rm -rf feeds/luci/applications/luci-app-airoha-npu
          # Use the pinned arm64 runtime packages from ci/packages instead of
          # the Go-built feed packages, which are not selectable on this target.
          rm -rf \
            feeds/packages/net/mihomo \
            feeds/packages/utils/yq \
            feeds/packages/net/nikki \
            feeds/helloworld/mihomo \
            feeds/luci/applications/luci-app-nikki \
            feeds/luci/themes/luci-theme-argon
          ./scripts/feeds install -a
          set +e
          make defconfig
          make_defconfig_rc=$?
          set -e
          echo "make_defconfig_rc=$make_defconfig_rc"
          grep -E '^CONFIG_(aarch64|ARCH_64BIT)|CONFIG_PACKAGE_(firewall4|ip-full|curl|ca-bundle|yq|nikki|mihomo|luci-app-nikki)' .config || true
          if [ -f tmp/.config-package.in ]; then
            echo "--- yq package Kconfig ---"
            grep -n -A18 -B2 'config PACKAGE_yq' tmp/.config-package.in || true
            echo "--- nikki package Kconfig ---"
            grep -n -A18 -B2 'config PACKAGE_nikki' tmp/.config-package.in || true
          fi
          grep -E '^CONFIG_TARGET_(DEVICE_)?airoha_an7581_DEVICE_gemtek_xr1710g=y$|^CONFIG_TARGET_ROOTFS_INITRAMFS=y$|^CONFIG_PACKAGE_(kmod-(dummy|inet-diag|nft-socket|nft-tproxy|tun)|nikki|mihomo|yq|luci-app-(airoha|nikki)|luci-i18n-(airoha|nikki)|luci-theme-argon|xr1710g-status-core)=y$' .config || true
          grep -qE '^CONFIG_TARGET_(DEVICE_)?airoha_an7581_DEVICE_gemtek_xr1710g=y$' .config
          for symbol in \
            CONFIG_TARGET_ROOTFS_INITRAMFS \
            CONFIG_PACKAGE_luci-app-package-manager \
            CONFIG_PACKAGE_luci-app-airoha-npu \
            CONFIG_PACKAGE_luci-app-airoha-flowsense \
            CONFIG_PACKAGE_luci-app-airoha-fancontrol \
            CONFIG_PACKAGE_luci-app-nikki \
            CONFIG_PACKAGE_luci-i18n-nikki-zh-cn \
            CONFIG_PACKAGE_luci-theme-argon \
            CONFIG_PACKAGE_nikki \
            CONFIG_PACKAGE_mihomo \
            CONFIG_PACKAGE_airoha-en7581-mt7996-npu-firmware \
            CONFIG_PACKAGE_xr1710g-npu-tuning \
            CONFIG_PACKAGE_yq
          do
            grep -q "^${symbol}=y$" .config || {
              echo "Missing requested config symbol: ${symbol}" >&2
              exit 1
            }
          done
          if [ "$make_defconfig_rc" -ne 0 ]; then
            echo "make defconfig returned $make_defconfig_rc" >&2
            exit "$make_defconfig_rc"
          fi

      - name: Download package sources
        working-directory: lede
        run: make download -j"$(nproc)"

      - name: Compile firmware
        working-directory: lede
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log

      - name: Verify built kernel carries FLOW_STATS
        working-directory: lede
        run: |
          set -euxo pipefail
          # CONFIG_NET_AIROHA_FLOW_STATS is patched into the target config
          # before the build; this proves it survived Kconfig and actually
          # reached the kernel that produced the image.
          set +o pipefail
          kcfg="$(grep -rl '^CONFIG_NET_AIROHA_FLOW_STATS=y$' build_dir/target-*/linux-*/ 2>/dev/null | head -n 1)"
          [ -n "$kcfg" ] || { echo "CONFIG_NET_AIROHA_FLOW_STATS missing from built kernel config" >&2; exit 1; }
          echo "kernel config: $kcfg"
          echo "FLOW_STATS OK"

      - name: Upload raw LEDE target output
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-lede-raw-${{ github.run_number }}
          path: lede/bin/targets/airoha/an7581/
          if-no-files-found: error

      - name: Verify final package manifest
        working-directory: lede
        run: |
          bash "$GITHUB_WORKSPACE/ci/scripts/verify-manifest.sh" \
            "$GITHUB_WORKSPACE/lede/bin/targets/airoha/an7581" \
            "$PROFILE"

      - name: Fetch verified U-Boot bundle member
        working-directory: lede
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/uboot"
          bash "$GITHUB_WORKSPACE/ci/scripts/fetch-uboot.sh" "$GITHUB_WORKSPACE/uboot"

      - name: Package release bundle
        working-directory: lede
        run: |
          release_tag="xr1710g-lede-${PROFILE}-$(date -u +%Y-%m)-r${{ github.run_number }}"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          RELEASE_TAG="$release_tag" BUILD_PROFILE="$PROFILE" \
            bash "$GITHUB_WORKSPACE/ci/scripts/package-artifacts.sh" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/lede" \
            "$GITHUB_WORKSPACE/uboot"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-${{ env.PROFILE }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-build-log-${{ github.run_number }}
          path: |
            lede/build.log
            lede/.config
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          lede_short="$(git -C lede rev-parse --short=12 HEAD)"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Monthly custom XR1710G build (${PROFILE} profile).

          - LEDE: \`${lede_short}\`
          - U-Boot release: \`${UBOOT_TAG}\`
          - UBI layout: UBI 2.0 (0x00700000 + 0x1b700000)

          The zip contains a LEDE sysupgrade FIT and the verified U-Boot
          chainloader slot. They target different flash regions and must not
          be merged or flashed interchangeably.
          EOF
          mapfile -t images < <(find "$GITHUB_WORKSPACE/dist/lede" -maxdepth 1 -type f -name '*.itb')
          mapfile -t metadata < <(find "$GITHUB_WORKSPACE/dist/lede" -maxdepth 1 -type f \( -name '*.manifest' -o -name '*.buildinfo' \))
          mapfile -t packages < <(find "$GITHUB_WORKSPACE/dist/packages" -maxdepth 1 -type f -name '*.ipk')
          gh release create "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/dist/${RELEASE_TAG}.zip" \
            "$GITHUB_WORKSPACE/dist/SHA256SUMS" \
            "$GITHUB_WORKSPACE/dist/BUILD_INFO.txt" \
            "$GITHUB_WORKSPACE/dist/uboot/xr1710g-chainloader-slot.bin" \
            "${images[@]}" \
            "${metadata[@]}" \
            "${packages[@]}" \
            --title "XR1710G LEDE ${PROFILE} ${RELEASE_TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
